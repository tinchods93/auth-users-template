Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${file(resources/index.json):userPool.name}
      Schema:
        - AttributeDataType: String
          Name: role
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailVerificationMessage: ${file(resources/cognito/emailTemplates/recuperarPassword.json):message}
      EmailVerificationSubject: ${file(resources/cognito/emailTemplates/recuperarPassword.json):subject}
      # EmailAuthenticationMessage: ${file(resources/cognito/emailTemplate.json):message}
      # EmailAuthenticationSubject: ${file(resources/cognito/emailTemplate.json):subject}
      AdminCreateUserConfig:
        InviteMessageTemplate:
          EmailMessage: ${file(resources/cognito/emailTemplates/bienvenida.json):message}
          EmailSubject: ${file(resources/cognito/emailTemplates/bienvenida.json):subject}
      AliasAttributes:
        - email
          # - Name: verified_phone_number
          #   Priority: 2

  # Cada user pool puede tener varios clientes
  # los clientes son las aplicaciones que se conectan al user pool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ${file(resources/index.json):userPoolClient.name}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH # esto significa que el admin puede crear usuarios sin necesidad de un flujo de autenticación
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
        - ALLOW_USER_SRP_AUTH
      RefreshTokenValidity: 10 # days
      IdTokenValidity: 24 # days
