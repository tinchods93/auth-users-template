createLicense:
  handler: src/infrastructure/primary/handlers/licenses/createLicense.handler
  description: 'Creates a license'
  name: ${file(resources/index.json):functions.createLicenseAction}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.createLicenseAction}
  iamRoleStatements: ${file(resources/iamRoleStatements/licenseActions/createLicenseAction.yml)}
  provisionedConcurrency: ${self:custom.provisionedConcurrency.${self:provider.stage}, 0}
  environment:
    REQUIRED_TOKEN_SCOPES: 'write.licenses'
  events:
    - http:
        path: /api/licenses
        method: post
        cors: true
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }
    - http:
        path: /licenses
        method: post
        cors: true
        authorizer:
          type: COGNITO_USER_POOLS
          authorizerId: { Ref: ApiGatewayAuthorizer }

getLicense:
  handler: src/infrastructure/primary/handlers/licenses/getLicense.handler
  description: 'Get license by id'
  name: ${file(resources/index.json):functions.getLicenseAction}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.getLicenseAction}
  iamRoleStatements: ${file(resources/iamRoleStatements/licenseActions/getLicenseAction.yml)}
  provisionedConcurrency: ${self:custom.provisionedConcurrency.${self:provider.stage}, 0}
  events:
    - http:
        # ?licence_id={licence_id}&user_id={user_id}
        path: /api/licenses
        method: get
        cors: true
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }
    - http:
        # ?licence_id={licence_id}&user_id={user_id}
        path: /licenses
        method: get
        cors: true
        authorizer:
          type: COGNITO_USER_POOLS
          authorizerId: { Ref: ApiGatewayAuthorizer }

